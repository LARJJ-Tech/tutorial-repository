name: Sync Issue Completion Date

on:
  issues:
    types:
      - closed
      - reopened

  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to test
        required: true
        type: number

permissions:
  contents: read

jobs:
  sync-completion-date:
    name: Sync completion date
    runs-on: ubuntu-latest

    steps:
      - name: Update Project completion date
        uses: actions/github-script@v9
        env:
          MANUAL_ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN }}
          retries: 3
          script: |
            const PROJECT_OWNER = "LARJJ-Tech";
            const PROJECT_NUMBER = 3;
            const COMPLETION_DATE_FIELD_NAME = "Completion date";
            const TEAM_TIME_ZONE = "America/New_York";

            /*
             * For an issue event, use the issue that triggered the workflow.
             * For manual testing, use the issue number entered in the
             * Actions interface.
             */
            const issueNumber =
              context.payload.issue?.number ??
              Number(process.env.MANUAL_ISSUE_NUMBER);

            if (!issueNumber) {
              core.setFailed("No issue number was provided.");
              return;
            }

            const repositoryOwner = context.repo.owner;
            const repositoryName = context.repo.repo;

            function formatTeamDate(value) {
              const parts = new Intl.DateTimeFormat("en-US", {
                timeZone: TEAM_TIME_ZONE,
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
              }).formatToParts(new Date(value));

              const values = Object.fromEntries(
                parts.map(part => [part.type, part.value])
              );

              return `${values.year}-${values.month}-${values.day}`;
            }

            /*
             * Retrieve the issue and all Project items connected to it.
             */
            const issueData = await github.graphql(`
              query(
                $owner: String!
                $repository: String!
                $issueNumber: Int!
              ) {
                repository(owner: $owner, name: $repository) {
                  issue(number: $issueNumber) {
                    id
                    number
                    title
                    state
                    closedAt

                    projectItems(first: 100) {
                      nodes {
                        id

                        project {
                          id
                          number
                          title

                          owner {
                            ... on Organization {
                              login
                            }

                            ... on User {
                              login
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `, {
              owner: repositoryOwner,
              repository: repositoryName,
              issueNumber,
            });

            const issue = issueData.repository?.issue;

            if (!issue) {
              core.setFailed(
                `Could not find ${repositoryOwner}/` +
                `${repositoryName}#${issueNumber}.`
              );
              return;
            }

            const projectItem = issue.projectItems.nodes.find(
              item =>
                item.project?.number === PROJECT_NUMBER &&
                item.project?.owner?.login === PROJECT_OWNER
            );

            if (!projectItem) {
              core.info(
                `${repositoryOwner}/${repositoryName}#${issue.number} ` +
                `is not in Project ${PROJECT_OWNER}/${PROJECT_NUMBER}.`
              );
              return;
            }

            /*
             * Retrieve the Project's Completion date field.
             */
            const projectData = await github.graphql(`
              query($owner: String!, $number: Int!) {
                organization(login: $owner) {
                  projectV2(number: $number) {
                    id
                    title

                    fields(first: 100) {
                      nodes {
                        ... on ProjectV2Field {
                          id
                          name
                          dataType
                        }
                      }
                    }
                  }
                }
              }
            `, {
              owner: PROJECT_OWNER,
              number: PROJECT_NUMBER,
            });

            const project = projectData.organization?.projectV2;

            if (!project) {
              core.setFailed(
                `Could not find Project ` +
                `${PROJECT_OWNER}/${PROJECT_NUMBER}.`
              );
              return;
            }

            const completionDateField = project.fields.nodes.find(
              field =>
                field?.name === COMPLETION_DATE_FIELD_NAME
            );

            if (!completionDateField) {
              core.setFailed(
                `Could not find a Project field named ` +
                `"${COMPLETION_DATE_FIELD_NAME}".`
              );
              return;
            }

            if (completionDateField.dataType !== "DATE") {
              core.setFailed(
                `"${COMPLETION_DATE_FIELD_NAME}" exists, but it ` +
                "is not a date field."
              );
              return;
            }

            async function setCompletionDate(date) {
              await github.graphql(`
                mutation(
                  $projectId: ID!
                  $itemId: ID!
                  $fieldId: ID!
                  $date: Date!
                ) {
                  updateProjectV2ItemFieldValue(
                    input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                      value: {
                        date: $date
                      }
                    }
                  ) {
                    projectV2Item {
                      id
                    }
                  }
                }
              `, {
                projectId: project.id,
                itemId: projectItem.id,
                fieldId: completionDateField.id,
                date,
              });
            }

            async function clearCompletionDate() {
              await github.graphql(`
                mutation(
                  $projectId: ID!
                  $itemId: ID!
                  $fieldId: ID!
                ) {
                  clearProjectV2ItemFieldValue(
                    input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                    }
                  ) {
                    projectV2Item {
                      id
                    }
                  }
                }
              `, {
                projectId: project.id,
                itemId: projectItem.id,
                fieldId: completionDateField.id,
              });
            }

            if (issue.state === "OPEN") {
              await clearCompletionDate();

              core.notice(
                `Cleared completion date for reopened issue ` +
                `${repositoryOwner}/${repositoryName}` +
                `#${issue.number}: ${issue.title}`
              );

              await core.summary
                .addHeading("Completion Date Synchronization")
                .addTable([
                  [
                    { data: "Issue", header: true },
                    { data: "Result", header: true },
                  ],
                  [
                    `${repositoryOwner}/${repositoryName}#${issue.number}`,
                    "Completion date cleared",
                  ],
                ])
                .write();

              return;
            }

            if (issue.state === "CLOSED" && issue.closedAt) {
              const completionDate = formatTeamDate(issue.closedAt);

              /*
               * This intentionally overwrites the existing value.
               * If an issue is reopened and closed again, closedAt contains
               * the latest closure time.
               */
              await setCompletionDate(completionDate);

              core.notice(
                `Set completion date to ${completionDate} for ` +
                `${repositoryOwner}/${repositoryName}` +
                `#${issue.number}: ${issue.title}`
              );

              await core.summary
                .addHeading("Completion Date Synchronization")
                .addTable([
                  [
                    { data: "Issue", header: true },
                    { data: "Completion date", header: true },
                  ],
                  [
                    `${repositoryOwner}/${repositoryName}#${issue.number}`,
                    completionDate,
                  ],
                ])
                .write();

              return;
            }

            core.info("The issue is not currently open or closed.");
